<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calypso</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Tells the browser to render native form chrome (select popups, checkboxes,
           scrollbars) with the light palette. Without this, an open <select> dropdown
           always uses the OS's light popup regardless of data-theme, so dark-mode text
           colors (meant for a dark background) land on a bright native background and
           become unreadable. */
        color-scheme: light;
        /* Fixed dark surface for floating chips (toast, canvas "Details" button) that
           are meant to read as a dark pill in both themes — intentionally NOT redefined
           under [data-theme='dark'] below, so it never flips like --siren-tx does. */
        --siren-inv: #14202f;
        --siren-bg: #eceff5;
        --siren-sf: #ffffff;
        --siren-sf2: #f6f8fc;
        --siren-sf3: #eef2f8;
        --siren-ln: #dde4ee;
        --siren-ln2: #c4cfe0;
        --siren-ln3: #aab8cc;
        --siren-tx: #14202f;
        --siren-dm: #5c6d84;
        --siren-dm2: #8b99ab;
        --siren-tl: #2f6b4a;
        --siren-tl2: #e6f0ea;
        --siren-tl3: #a9cdb8;
        --siren-tl-hover: #255840;
        --siren-am: #ac6f08;
        --siren-am2: #fdf0da;
        --siren-am3: #e8c184;
        --siren-vi: #6b5083;
        --siren-vi2: #efe9f3;
        --siren-vi3: #c4b1d1;
        --siren-hp: #bc4f1a;
        --siren-hp2: #fceadf;
        --siren-hp3: #eaa87c;
        --siren-bl: #2563c9;
        --siren-rd: #c8352c;
        --siren-rd2: #fdeceb;
        --siren-rd3: #eda49f;
        --siren-shadow-ss: 0 1px 2px rgba(20, 32, 47, 0.05);
        --siren-shadow-sm: 0 3px 8px rgba(20, 32, 47, 0.07), 0 1px 2px rgba(20, 32, 47, 0.05);
        --siren-shadow-sl: 0 12px 26px rgba(20, 32, 47, 0.12), 0 3px 8px rgba(20, 32, 47, 0.07);
        --siren-shadow-dialog: 0 22px 48px rgba(20, 32, 47, 0.22);
        --siren-backdrop: rgba(20, 32, 47, 0.35);
        --siren-memo-a: #fbfaf3;
        --siren-memo-b: #f5f3e8;
        --siren-hld-changed: #fff8e6;
        --siren-hld-changed-hover: #fff3d6;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --siren-bg: #0b0e15;
        --siren-sf: #141924;
        --siren-sf2: #171d2a;
        --siren-sf3: #1c2330;
        --siren-ln: #262f3f;
        --siren-ln2: #333e52;
        --siren-ln3: #4a5872;
        --siren-tx: #eef2f8;
        --siren-dm: #9aa7bd;
        --siren-dm2: #6b7891;
        --siren-tl: #6bc79a;
        --siren-tl2: #142d21;
        --siren-tl3: #2d523d;
        --siren-tl-hover: #58b386;
        --siren-am: #f0b84e;
        --siren-am2: #3a2c12;
        --siren-am3: #6b4f1e;
        --siren-vi: #b79bc9;
        --siren-vi2: #241f2c;
        --siren-vi3: #453a54;
        --siren-hp: #ff9152;
        --siren-hp2: #3a2515;
        --siren-hp3: #6b4020;
        --siren-bl: #6ea1ff;
        --siren-rd: #ff6b62;
        --siren-rd2: #3a1a18;
        --siren-rd3: #6d302c;
        --siren-shadow-ss: 0 1px 2px rgba(0, 0, 0, 0.4);
        --siren-shadow-sm: 0 3px 10px rgba(0, 0, 0, 0.42), 0 1px 3px rgba(0, 0, 0, 0.3);
        --siren-shadow-sl: 0 16px 32px rgba(0, 0, 0, 0.5), 0 5px 12px rgba(0, 0, 0, 0.32);
        --siren-shadow-dialog: 0 24px 56px rgba(0, 0, 0, 0.55);
        --siren-backdrop: rgba(0, 0, 0, 0.55);
        --siren-memo-a: #262a1e;
        --siren-memo-b: #2c3123;
        --siren-hld-changed: #362c12;
        --siren-hld-changed-hover: #3f331a;
      }
      html,
      body {
        background: var(--siren-bg);
        cursor: url('/cursors/default.svg') 4 4, auto;
      }
      /* Link-based navigation and native/MUI buttons that don't set an explicit cursor
         in their own sx (e.g. MUI Button/IconButton) rely on the browser default pointer,
         so they need their own rule. Elements with an explicit cursor in their component
         styles (emotion class selector) still win over this element selector. */
      a,
      button:not(:disabled) {
        cursor: url('/cursors/pointer.svg') 16 16, pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      input,
      textarea,
      [contenteditable='true'] {
        cursor: text;
      }
    </style>
    <script>
      // Set data-theme before first paint so there is no light->dark flash on load.
      (function () {
        try {
          if (localStorage.getItem('calypso-theme-mode') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          /* localStorage unavailable (private mode etc.) — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
