openapi: 3.0.3

# SIREN Observer 계약 v1
#
# 이 문서는 설계서(docs/siren-artifact-hub-design.md) §4의 정본 스펙이다.
# 산출물 서비스(Calypso, SimHub, SSM 어댑터 등)가 SIREN에 노출해야 하는 인터페이스와,
# 반대로 SIREN이 그 서비스들에게 제공하는 공용 데이터 API를 함께 정의한다.
#
# 각 서비스/어댑터는 이 명세를 참조해 자체 구현한다 - 공유 npm 패키지는 두지 않는다(§3.4).

info:
  title: SIREN Observer Contract
  version: '1.0'
  description: |
    두 방향의 계약을 담는다.

    - **서비스 → SIREN (관측)**: `/artifacts/*`. 산출물 서비스가 구현하고 SIREN이 호출한다.
      라벨·릴리스 여부·giver·lineage·바로가기 링크를 정규화된 형태로 돌려주고(current-version/
      versions), canView/canEdit(access)로 게이트 2를 판정해 준다. `/artifacts/{id}/access`가
      **유일한 필수 구현**이고 나머지(current-version, versions, artifacts 목록, html-view)는
      선택이다 — 없어도 계약 위반은 아니지만 없으면 그만큼 SIREN 쪽 기능이 줄어든다.
    - **SIREN → 서비스 (공용 데이터)**: `/hub/common`. SIREN이 구현하고 서비스들이 호출한다.
      프로젝트의 부서·멤버·일정을 내려준다.

    File Artifacts(B, Calypso)는 이 계약의 별도 구현체다 - `/artifacts/*`를 자체 구현하고
    있으며(calypso/src/artifacts/artifacts.controller.ts), 여느 서비스와 다르지 않다.
    `transport: "shared-db"`(공용 DB 경유) 방식은 폐기했다 - HPC망도 이제 양방향 API로
    직접 연동한다(설계서 04장 §2, 07장).

servers:
  - url: https://{serviceHost}/api
    description: 산출물 서비스(또는 어댑터)의 베이스 URL. 레지스트리의 baseUrl과 같다.
    variables:
      serviceHost:
        default: calypso.local

tags:
  - name: artifacts
    description: 산출물 서비스가 구현한다. SIREN이 호출한다.
  - name: hub
    description: SIREN이 구현한다. 산출물 서비스들이 호출한다.

paths:
  /artifacts/{artifactId}/current-version:
    get:
      tags: [artifacts]
      summary: 현재 버전 하나
      description: |
        SIREN이 캔버스에 버전 라벨을 그리고 Workflow Release 스냅샷을 찍을 때 호출한다.
        `versionRef`는 불변이어야 한다 - 한번 Release가 이 값을 고정하면 그 뒤로
        같은 ref가 다른 내용을 가리켜서는 안 된다(최소 soft-delete).
      operationId: getCurrentVersion
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/KnoxId'
        - $ref: '#/components/parameters/IsAdmin'
      responses:
        '200':
          description: 현재 버전
          headers:
            X-Observer-Contract:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  /artifacts/{artifactId}/versions:
    get:
      tags: [artifacts]
      summary: 버전 이력 (최신순)
      description: |
        SIREN은 이 응답을 그대로 보여주지 않는다 - `isReleased`와 조회자의 giver 여부로
        마스킹한 뒤에 내려보낸다(설계서 §6.2). 서비스는 자기가 아는 전부를 주면 된다.
      operationId: listVersions
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/KnoxId'
        - $ref: '#/components/parameters/IsAdmin'
      responses:
        '200':
          description: 최신이 배열 앞(index 0)
          headers:
            X-Observer-Contract:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  /artifacts/{artifactId}/access:
    get:
      tags: [artifacts]
      summary: 열람/편집 가능 여부 (게이트 2)
      description: |
        A/C Tier(OA Service/HPC Service) slide 열람의 게이트 2다(설계서 04장 §4.1) — 그
        artifact가 매핑된 block의 recipient(게이트 1)를 통과한 사람에 한해, 이 응답으로
        실제 데이터 접근 여부를 최종 판정한다. `editors` 목록 같은 건 요청하지 않는다 —
        canView/canEdit 두 값이면 충분하다.

        **fail-closed다** — 호출 실패·타임아웃이면 SIREN은 canView/canEdit 둘 다 false로
        취급한다. 그래서 이 라우트는 (current-version/versions와 달리) **선택이 아니라
        필수**다 — 없으면 그 서비스의 artifact는 아무에게도 안 보인다.

        권한이 없는 사용자에게도 403이 아니라 **200 + `{canView:false,canEdit:false}`**를
        준다 — 존재 자체를 숨기지 않는다.
      operationId: getAccess
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/KnoxId'
        - $ref: '#/components/parameters/IsAdmin'
      responses:
        '200':
          description: 접근 등급
          headers:
            X-Observer-Contract:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'

  /artifacts/{artifactId}/html-view:
    get:
      tags: [artifacts]
      summary: 한 버전의 html preview (선택 구현)
      description: |
        SIREN이 B Tier(File Artifacts)의 upload/download 화면 자리에, A/C Tier에서는
        이걸로 대신 보여준다. 슬라이드를 열면 latest version에 대해 한 번, 이후 사용자가
        `hasHtmlView: true`로 표시된 다른 버전을 고를 때마다 호출한다.

        구현하지 않아도 계약 위반은 아니다 - 이 라우트가 없거나(404) `versionLabel`에 해당하는
        preview가 없으면 SIREN은 그 버전을 그냥 클릭 불가/하이라이트 대상에서 뺀다(html도
        전혀 그리지 않는다).

        **SIREN은 이 응답을 항상 sandbox iframe(`srcdoc`, `allow-scripts`만, `allow-same-origin`
        없음)에 렌더한다** - 반환하는 html에 서비스 자신의 세션 쿠키나 SIREN의 인증 정보가
        섞여 들어가지 않게 할 것. 같은 이유로 SIREN도 이 html을 자기 origin에 직접 주입하지
        않는다.
      operationId: getHtmlView
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - name: versionLabel
          in: query
          required: true
          description: VersionRecord.versionLabel과 같은 값.
          schema: { type: string }
        - $ref: '#/components/parameters/KnoxId'
        - $ref: '#/components/parameters/IsAdmin'
      responses:
        '200':
          description: html + 그 html이 설계된 캔버스 크기. SIREN은 width를 상한선 안에서만 쓰고 비율을 유지해 줄인다.
          headers:
            X-Observer-Contract:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlView'
        '404':
          description: 그 버전엔 preview가 없다 (또는 이 엔드포인트 자체를 구현하지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /artifacts:
    get:
      tags: [artifacts]
      summary: 이 서비스가 들고 있는 산출물 목록 (선택 구현)
      description: |
        SIREN의 "새 Artifact 추가" 다이얼로그(설계서 04장 §6.3)가 매번 실시간으로 호출한다.
        **project 사전 링크 단계는 없다** — SIREN이 자기 project의 code+revision을 그대로
        필터로 실어 보내고, 그 서비스가 알아서 필터링해서 답한다. code+revision이 그 서비스
        안에서 유일하지 않을 수 있으면(예: production run·internal test가 같은 code/revision을
        쓰는 경우) 해당하는 후보를 전부 돌려주면 된다 — SIREN은 사람이 그중 하나를 고르게 한다.

        구현하지 않아도 계약 위반은 아니다 - 다만 이게 없으면 SIREN 쪽에서 그 서비스의
        산출물을 골라 워크플로우에 얹는 흐름을 쓸 수 없고, 사용자가 externalArtifactId를
        직접 입력해야 한다.
      operationId: listArtifacts
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: revision
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/KnoxId'
        - $ref: '#/components/parameters/IsAdmin'
      responses:
        '200':
          description: 산출물 요약 목록
          headers:
            X-Observer-Contract:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactSummary'

  /hub/common:
    get:
      tags: [hub]
      summary: 프로젝트 공용 데이터 (SIREN이 제공)
      description: |
        부서·멤버·일정. 각 서비스는 필요한 것만 골라 쓴다 - 권한 화면의 담당자 후보
        목록에는 members를, 자체 마감 관리에는 schedule을 쓴다.

        **이 API가 SIREN을 사실상 사내 신원·일정 공급자로 만든다.** SIREN 가용성이 각
        서비스의 권한 화면에 영향을 주므로, 서비스는 이 응답을 짧게 캐시하고 SIREN이
        응답하지 않을 때 마지막 캐시로 동작해야 한다(설계서 §4.4).

        HPC망 서비스도 이제 이 API를 직접 호출한다 - 양방향 API 연동이 확정되면서 공용 DB
        경유 방식은 폐기했다(설계서 04장 §2, 07장).
      operationId: getHubCommon
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 공용 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubCommon'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: 그 서비스 안에서의 산출물 식별자. SIREN은 이 값을 externalArtifactId로 들고 있다.
      schema: { type: string }

    KnoxId:
      name: knoxId
      in: query
      required: true
      description: |
        호출자의 KnoxID. 서비스는 이 값으로 access 판정을 하고(§access),
        current-version/versions 응답에서 작업중(미발행) 버전을 보여줄지도 이 값으로
        가른다(편집 권한자에게만). 신원 **주장**일 뿐 서명되어 있지 않다 — 서비스가
        직접 서명 검증을 하지 않는 한(대개 안 한다) 신뢰 경계는 "SIREN BE가 보냈다"는
        전제 하나뿐이다.
      schema: { type: string }

    IsAdmin:
      name: isAdmin
      in: query
      required: false
      description: |
        true일 때만 붙는다(false면 파라미터 자체를 생략 — SIREN 쪽 관례). 이 값을 받으면
        knoxId가 project member가 아니어도 편집자 시야(작업중 버전 포함)를 내려주는 건
        서비스가 **자발적으로 지원하는 선택 확장**이다 — 계약을 구현하지 않은 서비스에는
        그냥 무해한 여분 쿼리 파라미터다.
      schema: { type: boolean }

  headers:
    ContractVersion:
      description: 이 응답이 따르는 Observer 계약 버전. SIREN은 레지스트리의 contractVersion과 다르면 경고만 남기고 거부하지 않는다(§4.5).
      schema: { type: string, example: '1.0' }

  responses:
    NotFound:
      description: 그런 산출물(또는 프로젝트)이 없다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    VersionRecord:
      type: object
      description: |
        모든 티어가 공유하는 정규화 형태 (설계서 §4.1). **실제 소비 코드
        (`api/src/hub/observer-client.service.ts`의 `ObserverVersionRecord`)를 그대로 따른다** —
        `artifactId`/`versionRef`는 응답에 있어도 SIREN이 읽지 않는다(경로의 `artifactId`로
        이미 알고, `versionRef`는 이 계약에서 쓰지 않기로 했다 — `versionLabel`이 그 artifact
        안에서 재사용되지 않는다는 전제로 불변 참조를 겸한다). 보내도 무해하지만 필수는 아니다.
      required: [versionLabel, isReleased, giverKnoxId, giverDept, sourceRefs, viewUrl]
      properties:
        artifactId:
          type: string
          description: SIREN이 읽지 않는다 — 넣어도 되고 빼도 된다(레거시 필드로 남겨둠).
        versionRef:
          type: string
          nullable: true
          description: SIREN이 읽지 않는다(위 설명 참고) — 넣어도 되고 빼도 된다.
        versionLabel:
          type: string
          description: |
            표시용 자유 문자열. major.minor 규칙은 SIREN이 직접 만드는 서비스에만 강제하고,
            기존 시스템은 자기 넘버링 체계를 그대로 쓴다.
          example: 'v1.2'
        isReleased:
          type: boolean
          description: |
            **가시성 판정은 오직 이 필드로만 한다.** versionLabel의 모양을 파싱해서
            릴리스 여부를 추론하지 않는다.
        createdAt:
          type: string
          format: date-time
          nullable: true
        giverKnoxId:
          type: string
          nullable: true
          description: |
            이 버전을 만들어 제공한 사람. SIREN은 별도 role 엔드포인트를 호출하지 않고,
            이 값과 자기가 가진 멤버 데이터를 비교해 giver 여부를 스스로 계산한다(설계서 §4.3).
            개인 식별이 안 되면 null — 그럴 땐 giverDept만 채운다.
        giverDept:
          type: string
          nullable: true
          description: 부서 단위로만 알 수 있으면 여기만 채운다(giverKnoxId는 null).
        sourceRefs:
          type: array
          description: |
            lineage - 이 버전이 무엇으로부터 만들어졌는가. **만든 쪽이 자기신고한다.**
            SIREN이 캔버스 edge와 현재 버전을 조합해 추론하지 않는다.
            추적하지 못하는 서비스는 빈 배열을 준다 - 선택 필드다(설계서 §17.1).
          items:
            $ref: '#/components/schemas/SourceRef'
        viewUrl:
          type: string
          nullable: true
          description: 그 서비스의 산출물 상세 페이지. SIREN은 이 링크로 내보낸다.
        hasHtmlView:
          type: boolean
          default: false
          description: |
            이 버전을 `/artifacts/{artifactId}/html-view`로 열람할 수 있는가(선택 필드,
            안 주면 false). SIREN 슬라이드가 이 값으로 그 버전 카드를 클릭 가능/하이라이트
            대상으로 표시할지 정한다 - 실제 html은 그 버전을 고른 시점에 따로 요청한다.

    Access:
      type: object
      description: '`/artifacts/{artifactId}/access` 응답 — 게이트 2 판정 그 자체.'
      required: [canView, canEdit]
      properties:
        canView: { type: boolean }
        canEdit: { type: boolean }

    SourceRef:
      type: object
      required: [artifactKey, serviceKey, versionRef, versionLabel, capturedAt]
      properties:
        artifactKey: { type: string }
        serviceKey: { type: string }
        versionRef: { type: string }
        versionLabel: { type: string }
        capturedAt: { type: string, format: date-time }

    ArtifactSummary:
      type: object
      required: [artifactId, name, projectId, department, currentVersion]
      properties:
        artifactId: { type: string }
        name: { type: string }
        projectId: { type: string }
        department:
          type: string
          nullable: true
        currentVersion:
          allOf:
            - $ref: '#/components/schemas/VersionRecord'
          nullable: true
          description: 아직 버전이 하나도 없으면 null.

    HubCommon:
      type: object
      required: [projectId, members, departments, schedule]
      properties:
        projectId: { type: string }
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        departments:
          type: array
          items: { type: string }
        schedule:
          $ref: '#/components/schemas/Schedule'

    Member:
      type: object
      required: [knoxId]
      properties:
        knoxId: { type: string }
        name:
          type: string
          nullable: true
        dept:
          type: string
          nullable: true

    Schedule:
      type: object
      required: [milestones, workflowPhases]
      properties:
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Phase'
        workflowPhases:
          type: array
          items:
            type: object
            required: [workflowId, workflowName, phases]
            properties:
              workflowId: { type: string }
              workflowName: { type: string }
              phases:
                type: array
                items:
                  $ref: '#/components/schemas/Phase'

    Phase:
      type: object
      description: 부록 A.2 - PhaseRef{key,label,order}는 폐기됐고 {id,name,start,end}를 쓴다.
      required: [id, name, start, end]
      properties:
        id: { type: string }
        name: { type: string, example: 'ML3' }
        start: { type: string, format: date }
        end: { type: string, format: date }

    HtmlView:
      type: object
      required: [html, width, height]
      properties:
        html:
          type: string
          description: |
            완결된 html 문서(또는 문서로 취급해도 되는 조각). SIREN은 이걸 sandbox iframe에
            `srcdoc`으로 그대로 꽂는다 - script는 돌아가지만 부모 페이지(SIREN)의 쿠키·DOM에는
            닿지 않는다.
        width:
          type: integer
          description: 이 html이 설계된 캔버스 폭(px). SIREN은 자기 쪽 상한선 안에서 이 값과 height의 비율을 유지해 줄인다.
        height:
          type: integer
          description: 이 html이 설계된 캔버스 높이(px).

    Error:
