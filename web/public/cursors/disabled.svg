<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="dglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="ddrop" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.9" flood-color="#0b0f1c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g fill="none" stroke="#ffffff" opacity="0.85" filter="url(#dglow)">
    <circle cx="16" cy="16" r="9.5" stroke-width="5.2"/>
    <line x1="9.28" y1="9.28" x2="22.72" y2="22.72" stroke-width="5.2" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#5b6480" filter="url(#ddrop)">
    <circle cx="16" cy="16" r="9.5" stroke-width="2.6"/>
    <line x1="9.28" y1="9.28" x2="22.72" y2="22.72" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
