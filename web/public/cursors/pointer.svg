<!--
  SIREN 포인터 커서(링크·버튼·캔버스 블록 위).

  ★ 기본 커서와 **같은 화살표, 같은 hotspot (9,8)** 을 쓴다. 예전 포인터는 가운데가 빈
    조준선이었고 hotspot이 그 원의 정중앙(16,16)이라, 실제로 어디를 찍는지 읽히지 않고
    hover할 때마다 커서가 튀었다. 모양보다 그 기준점이 문제였다.

  · 대신 클릭 지점을 그대로 감싸는 얇은 링 하나를 더한다. 링의 중심이 곧 hotspot이라
    "여기가 눌리는 점"이 그림으로 설명된다. 속을 비워 두어 링 안의 대상이 그대로 보인다.
  · 링을 화살표보다 먼저 그려서 화살표의 흰 테두리가 링을 자연스럽게 끊고 지나가게 한다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="siren-arrow-p" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#7b70ff"/>
      <stop offset="1" stop-color="#3f34bd"/>
    </linearGradient>
    <filter id="siren-lift-p" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.1" flood-color="#0b0f1c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 흰 바탕 — 링과 화살표를 한 번에 들어올려 어떤 배경 위에서도 떨어져 보이게 한다 -->
  <g filter="url(#siren-lift-p)">
    <circle cx="9" cy="8" r="5.6" fill="none" stroke="#ffffff" stroke-width="3.2"/>
    <path d="M9 8 L9 24.24 L13.1 20.38 L15.97 26.86 L18.68 25.71 L15.89 19.32 L21.22 18.82 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <circle cx="9" cy="8" r="5.6" fill="none" stroke="#6f63ff" stroke-width="1.7"/>
  <path d="M9 8 L9 24.24 L13.1 20.38 L15.97 26.86 L18.68 25.71 L15.89 19.32 L21.22 18.82 Z"
        fill="url(#siren-arrow-p)"/>
</svg>
