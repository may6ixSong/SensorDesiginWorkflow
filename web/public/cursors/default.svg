<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6a5cf0"/>
      <stop offset="1" stop-color="#372ea8"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="drop" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="1.3" stdDeviation="1.2" flood-color="#0b0f1c" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip"><path d="M9.97 8.86 L9.97 8.86 Q9.00 8.00 9.00 9.30 L9.00 22.94 Q9.00 24.24 9.95 23.35 L12.15 21.27 Q13.10 20.38 13.63 21.57 L15.44 25.67 Q15.97 26.86 17.17 26.35 L17.48 26.22 Q18.68 25.71 18.16 24.52 L16.41 20.51 Q15.89 19.32 17.18 19.20 L19.93 18.94 Q21.22 18.82 20.25 17.96 Z"/></clipPath>
  </defs>

  <!-- 은은한 흰 글로우 — 예전의 딱딱한 테두리 대신 번지는 빛으로 배경과 분리한다 -->
  <path d="M9.97 8.86 L9.97 8.86 Q9.00 8.00 9.00 9.30 L9.00 22.94 Q9.00 24.24 9.95 23.35 L12.15 21.27 Q13.10 20.38 13.63 21.57 L15.44 25.67 Q15.97 26.86 17.17 26.35 L17.48 26.22 Q18.68 25.71 18.16 24.52 L16.41 20.51 Q15.89 19.32 17.18 19.20 L19.93 18.94 Q21.22 18.82 20.25 17.96 Z" fill="#ffffff" opacity="0.85" filter="url(#soft-glow)"/>

  <g filter="url(#drop)">
    <path d="M9.97 8.86 L9.97 8.86 Q9.00 8.00 9.00 9.30 L9.00 22.94 Q9.00 24.24 9.95 23.35 L12.15 21.27 Q13.10 20.38 13.63 21.57 L15.44 25.67 Q15.97 26.86 17.17 26.35 L17.48 26.22 Q18.68 25.71 18.16 24.52 L16.41 20.51 Q15.89 19.32 17.18 19.20 L19.93 18.94 Q21.22 18.82 20.25 17.96 Z" fill="url(#body)"/>
    <g clip-path="url(#clip)">
      <!-- 상단면 하이라이트 — 둥근 입체감을 만드는 밝은 결 -->
      <ellipse cx="12.5" cy="12" rx="6" ry="8" fill="#a89bff" opacity="0.35"/>
      <!-- 글로시 반사광 -->
      <ellipse cx="11" cy="10.5" rx="3.4" ry="4.6" fill="url(#gloss)"/>
      <!-- 아래쪽 젖힘부 그림자 — 꺾이는 안쪽 면을 살짝 어둡게 -->
      <path d="M13.1 20.38 L15.97 26.86 L18.68 25.71 L15.89 19.32 Z" fill="#241d78" opacity="0.16"/>
    </g>
  </g>
