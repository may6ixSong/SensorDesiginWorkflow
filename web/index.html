<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIREN · Sensor Design Workflow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ─────────────────────────────────────────────────────────────────────
         SIREN 디자인 토큰 (v3)

         값은 여기 한 곳에만 있다 — 렌더 차단 인라인 스크립트가 첫 페인트 전에
         data-theme을 적용해야 해서 어차피 이 파일에 있어야 하고, 두 벌로 나누면
         반드시 어긋난다. TS 쪽(src/theme/tokens.ts)은 var() 참조만 들고 있다.

         팔레트 방향 — "정밀 계측기". CIS 설계자가 하루 종일 들여다보는 화면이라
         채도를 낮추고 명도 단계를 촘촘히 뒀다. 강조색(--s-pr)은 인디고 계열 하나로
         제한하고, 색으로 의미를 나르는 자리는 tier/상태 토큰에만 허용한다.
         ───────────────────────────────────────────────────────────────────── */
      :root {
        /* 네이티브 폼 크롬(select 팝업, 스크롤바)을 라이트 팔레트로 그리게 한다.
           이게 없으면 열린 <select>가 항상 OS 라이트 팝업으로 떠서, 다크 모드용
           글자색이 밝은 배경 위에 얹혀 읽을 수 없게 된다. */
        color-scheme: light;

        /* ── 표면 ── 뒤에서 앞으로 4단계. 경계선 대신 이 단차로 깊이를 만든다 */
        --s-bg: #f3f4f9;
        --s-sf: #ffffff;
        --s-sf2: #f8f9fc;
        --s-sf3: #eef0f6;
        --s-sf4: #e4e7f0;

        /* ── 경계선 ── 대부분의 자리에는 --s-ln(머리카락 굵기)만 쓴다 */
        --s-ln: #e5e8f1;
        --s-ln2: #d2d7e5;
        --s-ln3: #b4bcd0;

        /* ── 글자 ── */
        --s-tx: #0f1322;
        --s-tx2: #333a52;
        --s-dm: #5b6480;
        --s-dm2: #8e96ad;

        /* 테마와 무관하게 항상 어두운 표면 — 툴팁·토스트처럼 떠 있는 칩용.
           --s-tx와 달리 다크에서 뒤집히지 않는다. */
        --s-inv: #12151f;
        --s-inv-tx: #ffffff;

        /* ── 강조(인디고) ── */
        --s-pr: #4a3fd0;
        --s-pr-hover: #3d33b4;
        --s-pr-soft: #ecebfb;
        --s-pr-line: #c7c2f2;
        --s-pr-tx: #ffffff;

        /* 상단바 SIREN 마크(SirenMark)·favicon 전용 — 예전엔 초록(#0c9a83) 계열이었는데,
           강조색이 인디고 하나로 통일된 뒤로는 로고만 혼자 다른 색이라 어색했다.
           별도 팔레트를 만들지 않고 --s-pr을 그대로 쓴다. */
        --siren-tl: var(--s-pr);
        --siren-tl2: var(--s-pr-soft);

        /* ── Tier ── A→D 신뢰도 내림차순. 이 순서가 색에서 읽혀야 한다 */
        --s-tier-a: #0e8f66;
        --s-tier-a-soft: #e3f5ee;
        --s-tier-b: #2563eb;
        --s-tier-b-soft: #e6edfe;
        --s-tier-c: #a35a06;
        --s-tier-c-soft: #fdf0dd;
        --s-tier-d: #64748b;
        --s-tier-d-soft: #eef1f5;

        /* ── 상태 ── */
        --s-ok: #0e8f66;
        --s-ok-soft: #e3f5ee;
        --s-ok-line: #a5d9c4;
        --s-warn: #a35a06;
        --s-warn-soft: #fdf0dd;
        --s-warn-line: #e8c184;
        --s-danger: #cf3341;
        --s-danger-soft: #fdeaec;
        --s-danger-line: #eda49f;
        --s-info: #2563eb;
        --s-info-soft: #e6edfe;
        --s-info-line: #a9c3f5;

        /* release 표에서 "이전 대비 바뀐 행" 단일 하이라이트 */
        --s-changed: #fff6e3;
        --s-changed-line: #f0d9a8;

        /* ── 캔버스 ── */
        --s-canvas-bg: #f0f2f8;
        --s-canvas-grid: #e2e6f0;
        /* 편집 중임이 한눈에 들어와야 한다 — 따뜻한 크림으로 전환한다 */
        --s-canvas-edit-bg: #fffbf2;
        --s-canvas-edit-grid: #efe4ce;
        --s-canvas-edit-line: #d9a441;
        --s-memo: #fdfaef;
        --s-memo-line: #e8dfc4;

        /* ── 그림자 ── 색을 섞어 회색 대신 팔레트에 녹아들게 한다 */
        --s-sh-xs: 0 1px 2px rgba(15, 19, 34, 0.05);
        --s-sh-sm: 0 2px 6px rgba(15, 19, 34, 0.06), 0 1px 2px rgba(15, 19, 34, 0.04);
        --s-sh-md: 0 6px 16px rgba(15, 19, 34, 0.08), 0 2px 5px rgba(15, 19, 34, 0.05);
        --s-sh-lg: 0 14px 34px rgba(15, 19, 34, 0.12), 0 4px 10px rgba(15, 19, 34, 0.06);
        --s-sh-xl: 0 28px 64px rgba(15, 19, 34, 0.2);
        --s-backdrop: rgba(15, 19, 34, 0.32);
        --s-ring: rgba(74, 63, 208, 0.32);
      }

      html[data-theme='dark'] {
        color-scheme: dark;

        --s-bg: #0a0c14;
        --s-sf: #12151f;
        --s-sf2: #161a26;
        --s-sf3: #1c2130;
        --s-sf4: #232939;

        --s-ln: #242a3a;
        --s-ln2: #313949;
        --s-ln3: #47526b;

        --s-tx: #edeff6;
        --s-tx2: #c8cddc;
        --s-dm: #98a1b8;
        --s-dm2: #6b748d;

        --s-pr: #8f86ff;
        --s-pr-hover: #a49cff;
        --s-pr-soft: #1d1b3a;
        --s-pr-line: #3b3672;
        --s-pr-tx: #0a0c14;

        --siren-tl: var(--s-pr);
        --siren-tl2: var(--s-pr-soft);

        --s-tier-a: #34d399;
        --s-tier-a-soft: #10281f;
        --s-tier-b: #6ea1ff;
        --s-tier-b-soft: #121e38;
        --s-tier-c: #f0b84e;
        --s-tier-c-soft: #2c2210;
        --s-tier-d: #94a3b8;
        --s-tier-d-soft: #1c2130;

        --s-ok: #34d399;
        --s-ok-soft: #10281f;
        --s-ok-line: #2d5c48;
        --s-warn: #f0b84e;
        --s-warn-soft: #2c2210;
        --s-warn-line: #6b4f1e;
        --s-danger: #ff6b76;
        --s-danger-soft: #331419;
        --s-danger-line: #6d302c;
        --s-info: #6ea1ff;
        --s-info-soft: #121e38;
        --s-info-line: #2f4573;

        --s-changed: #2f2612;
        --s-changed-line: #574620;

        --s-canvas-bg: #0c0f18;
        --s-canvas-grid: #1a1f2c;
        --s-canvas-edit-bg: #0e1524;
        --s-canvas-edit-grid: #1b2740;
        --s-canvas-edit-line: #c78a2a;
        --s-memo: #24261c;
        --s-memo-line: #3a3d2c;

        --s-sh-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
        --s-sh-sm: 0 2px 8px rgba(0, 0, 0, 0.44), 0 1px 3px rgba(0, 0, 0, 0.3);
        --s-sh-md: 0 8px 20px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.34);
        --s-sh-lg: 0 18px 40px rgba(0, 0, 0, 0.56), 0 5px 14px rgba(0, 0, 0, 0.36);
        --s-sh-xl: 0 32px 72px rgba(0, 0, 0, 0.62);
        --s-backdrop: rgba(0, 0, 0, 0.6);
        --s-ring: rgba(143, 134, 255, 0.4);
      }

      /* 커서 hotspot — 각 SVG 자기 모양의 초점(화살촉 끝 / 손끝)을 따로 쓴다.
         default는 (9 8), pointer는 (12 5)다. pointer 쪽 값은 tokens.ts의
         CURSOR_POINTER와도 같아야 한다 — 어긋나면 그 상수를 쓰는 요소(캔버스 블록 등)
         위에서만 클릭점이 손끝이 아닌 다른 자리가 된다. */
      html,
      body {
        background: var(--s-bg);
        cursor: url('/cursors/default.svg') 9 8, auto;
      }

      a,
      button:not(:disabled) {
        cursor: url('/cursors/pointer.svg') 12 5, pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      input,
      textarea,
      [contenteditable='true'] {
        cursor: text;
      }

      /* 숫자가 자리를 지켜야 읽기 편한 곳(버전·날짜·카운트)에 붙인다. */
      .s-tnum {
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
      }

      /* 모션을 끈 사용자에게는 전환을 전부 없앤다. framer-motion 쪽은
         usePrefersReducedMotion 훅이 따로 처리하고, 여기서는 CSS 전환을 막는다. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script>
      // Set data-theme before first paint so there is no light->dark flash on load.
      (function () {
        try {
          if (localStorage.getItem('siren-theme-mode') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          /* localStorage unavailable (private mode etc.) — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
