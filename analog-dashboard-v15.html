<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ACRO · CIS 산출물 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff5;--sf:#fff;--sf2:#f6f8fc;--sf3:#eef2f8;
  --ln:#dde4ee;--ln2:#c4cfe0;--ln3:#aab8cc;
  --tx:#14202f;--dm:#5c6d84;--dm2:#8b99ab;
  --tl:#0c9a83;--tl2:#e0f5f0;--tl3:#8ad9c9;
  --am:#ac6f08;--am2:#fdf0da;--am3:#e8c184;
  --vi:#5849cf;--vi2:#ece9fd;--vi3:#b8afef;
  --hp:#bc4f1a;--hp2:#fceadf;--hp3:#eaa87c;
  --bl:#2563c9;--rd:#c8352c;
  --ss:0 1px 2px rgba(20,32,47,.06);
  --sm:0 4px 10px rgba(20,32,47,.08),0 1px 3px rgba(20,32,47,.05);
  --sl:0 16px 34px rgba(20,32,47,.15),0 4px 10px rgba(20,32,47,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--sf);color:var(--tx);
  border:1px solid var(--ln2);border-radius:7px;padding:8px 10px;width:100%;outline:none;user-select:text}
input:focus,select:focus,textarea:focus{border-color:var(--tl);box-shadow:0 0 0 3px var(--tl2)}
input.err{border-color:var(--rd)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:7px}
.mono{font-family:'IBM Plex Mono',monospace}
.ey{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dm2)}
/* topbar */
.tb{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--ln);background:var(--sf);z-index:50;box-shadow:var(--ss)}
.mark{flex:0 0 auto;display:block}
.wm{font-size:15px;font-weight:800;font-family:'Syne',sans-serif;line-height:1.05}
.wm small{display:block;font-size:9px;letter-spacing:.18em;color:var(--dm2);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.dv{width:1px;height:22px;background:var(--ln)}
.sb{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:8px;background:var(--sf2);border:1px solid var(--ln)}
.sb select{border:none;background:none;padding:0;width:auto;font-weight:600;font-size:13px;box-shadow:none;cursor:pointer}
.sb select:focus{box-shadow:none}
.sp{flex:1}
.av{border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:6px;
  background:var(--sf2);border:1px solid var(--ln);color:var(--dm)}
.chip.s{background:var(--tl2);border-color:var(--tl3);color:var(--tl)}
.chip.v{background:var(--vi2);border-color:var(--vi3);color:var(--vi)}
/* ip head */
.ih{padding:9px 20px;border-bottom:1px solid var(--ln);background:var(--sf);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* stepper — lives OUTSIDE the scrolling area, stays fixed */
.st-shell{overflow:hidden;border-bottom:1px solid var(--ln);background:var(--sf2);position:relative;flex:0 0 auto}
.st-track{display:flex;white-space:nowrap;will-change:transform}
/* one arrow cell */
.ph{position:relative;display:inline-flex;flex-direction:column;justify-content:center;
  padding:8px 22px 8px 28px;background:var(--sf);border:1px solid var(--ln);text-align:left;
  transition:background .15s;flex:0 0 auto;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);overflow:hidden;
  cursor:pointer}
.ph:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:18px}
.ph:hover{background:var(--sf3)}
.ph.on{background:linear-gradient(180deg,#d9f3ec,#eaf9f5);
  filter:
    drop-shadow(1.5px 0 0 var(--tl))
    drop-shadow(-1.5px 0 0 var(--tl))
    drop-shadow(0 1.5px 0 var(--tl))
    drop-shadow(0 -1.5px 0 var(--tl));
  z-index:3}
.ph.on .ph-k{color:var(--tl)}
.ph.past{background:var(--sf2)}.ph.past .ph-k{color:var(--dm)}
.ph-k{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.05em}
.ph-l{font-size:11px;color:var(--dm);margin:1px 0 2px;overflow:hidden;text-overflow:ellipsis}
.ph-d{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dm2)}
.ph-c{position:absolute;bottom:7px;right:20px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dm2)}
.ph-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tl);opacity:.5}
.ph-badge{position:absolute;top:5px;right:20px;font-size:8px;font-family:'IBM Plex Mono',monospace;color:var(--vi)}
/* phase resize handle — right edge of each phase cell */
.ph-resize{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;z-index:5;
  display:flex;align-items:center;justify-content:center;background:transparent;transition:background .14s}
.ph-resize:hover{background:rgba(12,154,131,.18)}
/* ↔ arrows drawn with pseudo-elements */
.ph-resize::before,.ph-resize::after{content:'';position:absolute;top:50%;
  width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.55;transition:opacity .14s}
.ph-resize::before{right:6px;border-right:5px solid var(--dm2);transform:translateY(-50%)}
.ph-resize::after{left:0;border-left:5px solid var(--dm2);transform:translateY(-50%) translateX(0)}
.ph-resize:hover::before,.ph-resize:hover::after{opacity:1;border-right-color:var(--tl);border-left-color:var(--tl)}
/* dotted line in center */
.ph-resize-line{position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--ln2);pointer-events:none;z-index:4;transition:background .14s}
.ph:hover .ph-resize-line{background:var(--tl3)}
.ph-resize:active ~ .ph-resize-line,.ph-resize:hover ~ .ph-resize-line{background:var(--tl)}
/* shared button */
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:6px 11px;
  border-radius:7px;background:var(--sf);border:1px solid var(--ln2);transition:.14s;box-shadow:var(--ss)}
.btn:hover{background:var(--sf3)}
.btn.on{background:var(--tl2);border-color:var(--tl3);color:var(--tl)}
.btn.pr{background:var(--tl);color:#fff;border-color:transparent}
.btn.pr:hover{background:#0bab90}
.btn.gh{background:transparent;border-color:transparent;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* legend strip (now in ip-head area via inline render) */
.lg{display:flex;gap:11px;font-size:11px;color:var(--dm);align-items:center;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:4px}
.lgd{width:8px;height:8px;border-radius:3px}
/* floating toolbox — bottom-left of canvas */
.toolbox{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;flex-direction:row;
  align-items:flex-end;gap:6px;pointer-events:none}
.toolbox.active{pointer-events:all}
.tb-group{display:flex;flex-direction:row;gap:4px;background:var(--sf);border:1px solid var(--ln2);
  border-radius:11px;padding:6px;box-shadow:var(--sl)}
.tb-btn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--dm);cursor:pointer;transition:.14s;position:relative}
.tb-btn:hover{background:var(--sf2);color:var(--tx)}
.tb-btn.on{background:var(--tl2);border-color:var(--tl3);color:var(--tl)}
.tb-btn.danger:hover{background:#fde8e7;color:var(--rd)}
/* tooltip appears ABOVE since toolbox is at the bottom */
.tb-btn[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);background:var(--tx);color:#fff;font-size:11.5px;padding:4px 9px;
  border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:var(--sm);z-index:30}
.tb-sep{width:1px;background:var(--ln);margin:0 2px}
/* edit mode ring on canvas */
body.edit #vp{outline:2px solid var(--tl3);outline-offset:-2px}
/* viewport */
.vp{flex:1;overflow-x:hidden;overflow-y:auto;position:relative;background:var(--bg)}
/* canvas — 가로만 transform(pan+zoom), 세로는 부모 스크롤 */
.cv{position:relative;transform-origin:0 0;will-change:transform}
body.view .cv{background:var(--sf)}
body.edit .cv{
  background-image:radial-gradient(circle,var(--ln) 1px,transparent 1px);
  background-size:20px 20px;background-color:var(--sf)}
@keyframes flowdash{0%{stroke-dashoffset:18}to{stroke-dashoffset:0}}
.flowdash-bg{opacity:0}  /* 하이라이트 시 실선 숨김 */
/* today marker — 블록 뒤에 깔림 */
.today-line{position:absolute;top:0;bottom:0;width:1.5px;background:var(--rd);opacity:.55;z-index:0;pointer-events:none}
/* stepper 위에 겹치는 today 마커 */
.today-st{position:absolute;top:0;bottom:0;width:1.5px;background:var(--rd);opacity:.75;z-index:6;pointer-events:none}
.today-cap{position:absolute;top:0;transform:translateX(-50%);background:var(--rd);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;padding:2px 7px;
  border-radius:0 0 6px 6px;white-space:nowrap;z-index:7;pointer-events:none;box-shadow:var(--ss)}
/* lane dividers */
.lane{position:absolute;top:0;bottom:0;border-right:2px dashed var(--ln2);pointer-events:none}
.lane-k{position:absolute;top:10px;left:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;color:var(--dm2)}
.lane-l{position:absolute;bottom:10px;left:10px;font-size:10px;color:var(--ln3)}
/* phase resize handle ON CANVAS */
.lane-resize{position:absolute;right:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:6;
  background:transparent;pointer-events:all;display:flex;align-items:center;justify-content:center}
.lane-resize::before{content:'⟺';position:absolute;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--dm2);opacity:0;transition:opacity .14s;pointer-events:none;
  background:var(--sf);border:1px solid var(--ln2);border-radius:4px;padding:1px 3px;white-space:nowrap}
.lane-resize:hover::before{opacity:1;color:var(--tl);border-color:var(--tl3)}
.lane-resize:hover{background:rgba(12,154,131,.15)}
/* edges */
.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.eh{pointer-events:stroke;cursor:pointer}
/* blocks */
.blk{position:absolute;border-radius:10px;background:var(--sf);border:1px solid var(--ln2);
  box-shadow:var(--sm);overflow:hidden}
.blk.nd{padding:8px 9px 7px}
.blk.nd::before{content:'';position:absolute;top:7px;left:7px;width:4px;height:4px;
  border-radius:50%;background:var(--ln3)}
body.view .blk.nd{cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .14s}
body.view .blk.nd:hover{transform:translateY(-2px);box-shadow:var(--sl);border-color:var(--ln3)}
body.edit .blk{cursor:grab}
.blk.dg{cursor:grabbing!important;box-shadow:var(--sl);border-color:var(--tl);z-index:30;transition:none!important}
.blk.rs{z-index:30;transition:none!important}
.blk.bump{border-color:var(--rd)}
.blk.hl{outline:2px solid var(--vi);outline-offset:2px}
.blk.lk{border-color:var(--vi)}
.blk.sel{border-color:var(--tl);box-shadow:0 0 0 3px var(--tl2),var(--sm)}
.nt{display:flex;align-items:flex-start;gap:7px;padding-left:8px}
.ntx{font-size:11.5px;font-weight:600;line-height:1.35;flex:1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nm{font-size:9.5px;color:var(--dm2);margin:6px 0 6px;padding-left:8px;
  font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv{display:flex;gap:4px;padding-left:8px;flex-wrap:wrap}
.vc{font-family:'IBM Plex Mono',monospace;font-size:8.5px;padding:1px 4px;border-radius:5px;border:1px solid transparent}
.vc.r{background:var(--tl2);color:var(--tl);border-color:var(--tl3)}
.vc.w{background:var(--am2);color:var(--am);border-color:var(--am3)}
.vc.n{background:var(--sf2);color:var(--dm2);border-color:var(--ln)}
.vc.d{background:var(--vi2);color:var(--vi);border-color:var(--vi3)}
.bdg{font-size:8px;font-family:'IBM Plex Mono',monospace;padding:1px 4px;border-radius:5px;border:1px solid transparent}
.phpick{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;
  border-radius:7px;background:var(--sf);border:1px solid var(--ln2);color:var(--dm);transition:.14s}
.phpick:hover{background:var(--sf3)}
.phpick.on{background:var(--tl2);border-color:var(--tl);color:var(--tl)}
.openbtn{position:absolute;left:50%;top:-32px;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--tx);color:#fff;font-size:11.5px;font-weight:500;padding:5px 11px;
  border-radius:7px;box-shadow:var(--sl);z-index:40;cursor:pointer;animation:pop .16s ease-out}
.openbtn::after{content:'';position:absolute;left:50%;bottom:-4px;width:8px;height:8px;
  background:var(--tx);transform:translateX(-50%) rotate(45deg)}
.openbtn:hover{background:#000}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(4px)}}
.blk.nd{overflow:visible}
.seq{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;padding:1px 5px;border-radius:9px;
  background:var(--vi2);color:var(--vi);border:1px solid var(--vi3);flex:0 0 auto;margin-top:1px}
.ntag{position:absolute;top:0;right:0;font-family:'IBM Plex Mono',monospace;font-size:8px;
  letter-spacing:.08em;padding:2px 7px 3px;border-bottom-left-radius:8px}
.ntag.oa{background:var(--sf3);color:var(--dm)}
.ntag.hpc{background:var(--hp2);color:var(--hp)}
.blk.mo{padding:10px 11px;
  background:repeating-linear-gradient(135deg,#fbfaf3 0 9px,#f5f3e8 9px 18px);
  border:1px dashed var(--ln3);color:var(--dm);font-size:12px;line-height:1.5;cursor:default}
body.edit .blk.mo{cursor:grab}
.mtag{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--dm2);display:block;margin-bottom:5px}
.mtx{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pin{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--sf);border:2px solid var(--ln3);transition:.12s;z-index:4}
.pin.l{left:-6px}.pin.r{right:-6px}
.pin.r:hover,.pin.a{background:var(--tl);border-color:var(--tl);transform:scale(1.3);cursor:crosshair}
.blk.lk .pin.l{background:var(--vi);border-color:var(--vi)}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.grip::after{content:'';position:absolute;right:3px;bottom:3px;width:8px;height:8px;
  border-right:2px solid var(--ln3);border-bottom:2px solid var(--ln3)}
.grip:hover::after{border-color:var(--tl)}
/* pan hint */
.pan-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;
  font-size:11.5px;padding:5px 12px;border-radius:7px;opacity:0;pointer-events:none;z-index:10;transition:opacity .2s}
.pan-hint.show{opacity:.85}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,32,47,.35);backdrop-filter:blur(2px);
  display:grid;place-items:center;z-index:60;padding:20px}
.modal{width:640px;max-width:100%;max-height:90vh;background:var(--sf);border:1px solid var(--ln2);
  border-radius:14px;display:flex;flex-direction:column;box-shadow:0 28px 60px rgba(20,32,47,.27);overflow:hidden}
.mh{padding:15px 20px 0}
.mb{padding:15px 20px 20px;overflow-y:auto;background:var(--sf2)}
.tabs{display:flex;gap:2px;margin-top:11px;border-bottom:1px solid var(--ln)}
.tab{padding:8px 13px;font-size:12.5px;font-weight:500;color:var(--dm);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--tl);border-bottom-color:var(--tl)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;color:var(--dm);margin-bottom:5px;font-weight:500}
.row{display:flex;gap:9px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:13px}
.vs{perspective:1000px;padding:4px 0}
.vl{background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:10px 13px;
  margin-bottom:6px;transition:transform .2s,box-shadow .2s;transform-style:preserve-3d}
.vl.mj{border-left:3px solid var(--tl)}
.vl.mn{border-left:3px solid var(--am3);background:var(--sf2)}
.vl:hover{transform:translateZ(20px) rotateX(3deg);box-shadow:var(--sl);z-index:2}
.vn{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
.vno{font-size:12px;color:var(--dm);margin-top:4px}
.vme{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dm2);margin-top:4px;word-break:break-all}
.warn{display:flex;gap:9px;padding:10px 13px;border-radius:9px;font-size:12px;
  background:var(--hp2);border:1px solid var(--hp3);color:#8d3c12;line-height:1.55}
.el{font-size:11px;color:var(--rd);margin:-5px 0 10px}
.empty{flex:1;display:grid;place-items:center;padding:40px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:#fff;
  font-size:12.5px;padding:8px 15px;border-radius:8px;box-shadow:var(--sl);z-index:80;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body class="view">
<div class="tb">
  <svg class="mark" width="28" height="28" viewBox="0 0 32 32" fill="none" aria-label="Acro">
    <path d="M16 29V13" stroke="#0c9a83" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 20.5 L9.5 15M16 17 L22.5 11.5M16 24 L21.5 19.5" stroke="#0c9a83"
      stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="16" cy="9.5" r="4.6" fill="#e0f5f0" stroke="#0c9a83" stroke-width="1.5"/>
    <circle cx="8.6" cy="14.2" r="3.1" fill="#e0f5f0" stroke="#0c9a83" stroke-width="1.4"/>
    <circle cx="23.4" cy="10.6" r="2.8" fill="#e0f5f0" stroke="#0c9a83" stroke-width="1.4"/>
    <circle cx="22.4" cy="18.8" r="2.4" fill="#e0f5f0" stroke="#0c9a83" stroke-width="1.3"/>
    <circle cx="16" cy="9.5" r="1.5" fill="#0c9a83"/>
    <path d="M12 29h8" stroke="#0c9a83" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div class="wm">ACRO<small>CIS DELIVERABLE CONTROL</small></div>
  <div class="dv"></div>
  <div class="sb"><span class="ey">과제</span><select id="projSel"></select></div>
  <div class="sb"><span class="ey">IP</span><select id="ipSel" style="min-width:110px"></select></div>
  <div class="sp"></div>
  <button class="btn" id="recvTog" style="display:none"></button>
  <div class="sb" style="padding-left:6px"><span id="meAv"></span>
    <select id="userSel" style="width:158px"></select></div>
</div>
<main style="flex:1;display:flex;flex-direction:column;min-height:0" id="main"></main>
<div id="mroot"></div>
<div class="toast" id="toast"></div>

<script>
const I=(p,s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
  word:I('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',14),
  excel:I('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',14),

/* ── 산출물 Release 일정(다중 Phase) ──
   같은 산출물이 여러 Phase에서 갱신·릴리스될 때, Phase마다 인스턴스를 만든다.
   series: 원본 산출물 id, seriesIdx: 회차(1부터) */
function seriesOf(ip,sid){
  return ITEMS.filter(d=>d.ip===ip&&(d.series||d.id)===sid)
    .sort((a,b)=>(a.seriesIdx||1)-(b.seriesIdx||1));
}
const seriesKey=d=>d.series||d.id;
/* 산출물의 Release 일정을 phaseIds 배열로 재설정 */
function setSchedule(base,phaseIds){
  const ip=base.ip, sid=seriesKey(base);
  const cur=seriesOf(ip,sid);
  const order={};phsFor(ip).forEach((p,i)=>order[p.id]=i);
  const want=[...new Set(phaseIds)].sort((a,b)=>(order[a]??99)-(order[b]??99));
  // 제거 대상
  cur.filter(d=>!want.includes(d.phase)).forEach(d=>{
    if(d.id===sid&&want.length){          // 원본은 유지하고 첫 Phase로 이동
      d.phase=want[0];
    }else{
      ITEMS=ITEMS.filter(x=>x.id!==d.id);
      EDGES=EDGES.filter(e=>e.from!==d.id&&e.to!==d.id);
    }
  });
  // 추가 대상
  want.forEach(ph=>{
    if(!ITEMS.some(d=>d.ip===ip&&seriesKey(d)===sid&&d.phase===ph)){
      const g=laneG(ip)[ph]||{x:0,w:DEFAULT_PW};
      ITEMS.push({id:sid+"_"+ph,ip,phase:ph,name:base.name,type:base.type,net:base.net,
        series:sid,recvDept:base.recvDept,recvContact:base.recvContact,versions:[],
        w:base.w||NW,h:base.h||NH,x:g.x+LANE_PAD,y:1e6});
    }
  });
  // 회차 번호 재부여 + 순차 flow 자동 연결(사용자가 만든 다른 연결은 보존)
  const list=seriesOf(ip,sid);
  list.forEach((d,i)=>{d.seriesIdx=i+1;d.seriesTotal=list.length;});
  for(let i=0;i<list.length-1;i++){
    const a=list[i],b=list[i+1];
    if(!EDGES.some(e=>e.from===a.id&&e.to===b.id))
      EDGES.push({id:"sq"+a.id+"_"+b.id,from:a.id,to:b.id,auto:true});
  }
  // 더 이상 인접하지 않은 auto edge 정리
  EDGES=EDGES.filter(e=>{
    if(!e.auto)return true;
    const A=itm(e.from),B=itm(e.to);
    if(!A||!B)return false;
    if(seriesKey(A)!==sid||seriesKey(B)!==sid)return true;
    return (B.seriesIdx-A.seriesIdx)===1;
  });
  want.forEach(ph=>reflowLane(ip,ph));
}

function laneOverflow(ip,pid){

/* 모든 Phase 레인 x를 재계산해 블록을 레인 안으로 당김 (Phase 순서 변경 후) */
function realignAllLanes(ip){
  const G=laneG(ip);
  blksOf(ip).forEach(b=>{
    const g=G[b.phase];if(!g)return;
    // x가 해당 레인 범위 밖이면 레인 안쪽 LANE_PAD로 이동
    if(b.x<g.x||b.x+b.w>g.x+g.w)b.x=snp(g.x+LANE_PAD);

/* 레인 안에서 좌→우 배치, 폭이 모자라면 아래 줄로 개행 */
function reflowLane(ip,pid){
  const g=laneG(ip)[pid];if(!g)return;
  const lx=g.x+LANE_PAD, lw=g.w-LANE_PAD*2;
  const bs=[...ITEMS.filter(d=>d.ip===ip&&d.phase===pid),
            ...NOTES.filter(n=>n.ip===ip&&n.phase===pid)];
  if(!bs.length)return;
  // 기존 시각 순서(위→아래, 좌→우) 보존
  bs.sort((a,b)=>Math.abs(a.y-b.y)>ROW_H/2?a.y-b.y:a.x-b.x);
  let cx=lx, cy=TOP_PAD, rowH=0;
  bs.forEach(b=>{
    if(cx>lx && cx+b.w>lx+lw){   // 개행
      cx=lx; cy+=rowH+GAP; rowH=0;
    }
    b.x=snp(cx); b.y=snp(cy);
    cx+=b.w+GAP; rowH=Math.max(rowH,b.h);
  });
}

/* collision */
const blksOf=ip=>[...ITEMS.filter(d=>d.ip===ip),...NOTES.filter(n=>n.ip===ip)];
function resolve(moveId,tgt,dx,dy,B){
  const bl=blksOf(S.ipId),P={};
  const LG=laneG(S.ipId);              // 각 블록이 속한 Phase 레인 범위
  bl.forEach(b=>P[b.id]={x:b.x,y:b.y,w:b.w,h:b.h});
  P[moveId]={x:tgt.x,y:tgt.y,w:tgt.w,h:tgt.h};
  const hit=(a,b)=>a.x<b.x+b.w+GAP&&a.x+a.w+GAP>b.x&&a.y<b.y+b.h+GAP&&a.y+a.h+GAP>b.y;
  const q=[moveId];let g=0;
  while(q.length){if(++g>400)return null;
    const id=q.shift(),A=P[id];
    for(const b of bl){if(b.id===id)continue;const C=P[b.id];if(!hit(A,C))continue;
      const pR=A.x+A.w+GAP-C.x,pL=C.x+C.w+GAP-A.x,pD=A.y+A.h+GAP-C.y,pU=C.y+C.h+GAP-A.y;
      let ex=0,ey=0;
      if(dx!==0&&Math.abs(dx)>=Math.abs(dy))ex=dx>0?pR:-pL;
      else if(dy!==0)ey=dy>0?pD:-pU;
      else{const m=Math.min(pR,pL,pD,pU);if(m===pR)ex=pR;else if(m===pL)ex=-pL;else if(m===pD)ey=pD;else ey=-pU;}
      let nb={w:C.w,h:C.h,x:snp(C.x+ex),y:snp(C.y+ey)};
      // 밀려나는 블록이 자기 Phase 레인을 벗어나면 → 수평 대신 아래로 개행
      if(ex!==0&&b.id!==moveId){
        const lr=LG[b.phase];
        if(lr&&(nb.x<lr.x+LANE_PAD||nb.x+nb.w>lr.x+lr.w-LANE_PAD)){
          nb={w:C.w,h:C.h,x:C.x,y:snp(C.y+pD)};
        }
      }
      if(nb.x<PAD||nb.y<PAD||nb.x+nb.w>B.w-PAD||nb.y+nb.h>B.h-PAD)return null;
      P[b.id]=nb;q.push(b.id);}}return P;
}

/* ── PHASE RESIZE WITH BLOCK REFLOW ── */
// Minimum phase width = max(block_w_in_phase * 2, 120)
function minPW(pid){
  const ip=S.ipId;if(!ip)return 120;
  const blks=[...ITEMS.filter(d=>d.ip===ip&&d.phase===pid),
              ...NOTES.filter(n=>n.ip===ip&&n.phase===pid)];
  const maxW=blks.reduce((m,b)=>Math.max(m,b.w||NW),NW);
  return Math.max(maxW+LANE_PAD*2+GAP, 240);
}

function resizePhase(pid, rawNewW){
  if(!S.ipId)return;
  const ip=S.ipId;
  const phs=phsFor(ip);
  const pidIdx=phs.findIndex(p=>p.id===pid);
  if(pidIdx<0)return;

  // clamp to minimum
  const nw=Math.max(minPW(pid), Math.round(rawNewW));
  const oldW=getPW(pid);
  if(nw===oldW)return;
  phasePW[pid]=nw;

  // recompute all lane x offsets
  const G=laneG(ip); // uses updated phasePW

  // ── recalc old lane starts, diff against new, move blocks ──
  // Compute old lane starts (before resize) by temporarily restoring old width
  phasePW[pid]=oldW;
  const Gol=laneG(ip);
  phasePW[pid]=nw;   // restore new value
  const Gnew=laneG(ip);

  phs.forEach((p,i)=>{
    if(i<pidIdx)return; // phases before resized: unchanged
    const oldLaneX=(Gol[p.id]||{x:0}).x;
    const newLaneX=(Gnew[p.id]||{x:0}).x;
    const dx=newLaneX-oldLaneX;
    if(dx===0)return;

    const phBlks=[...ITEMS.filter(d=>d.ip===ip&&d.phase===p.id),
                  ...NOTES.filter(n=>n.ip===ip&&n.phase===p.id)];
    phBlks.forEach(b=>{ b.x=snp(Math.max(PAD,b.x+dx)); });
  });

  // ── 리사이즈된 레인: 폭이 모자라면 좌→우 재배치 + 개행 ──
  if(laneOverflow(ip,pid)) reflowLane(ip,pid);

  // ── run collision resolve pass for entire ip ──
  const allBlks=blksOf(ip);
  // simple iterative: sort by x,y and push collisions downward
  for(let iter=0;iter<8;iter++){
    allBlks.sort((a,b)=>a.x!==b.x?a.x-b.x:a.y-b.y);
    let moved=false;
    for(let i=0;i<allBlks.length;i++){
      for(let j=i+1;j<allBlks.length;j++){
        const A=allBlks[i],B=allBlks[j];
        if(A.x<B.x+B.w+GAP&&A.x+A.w+GAP>B.x&&A.y<B.y+B.h+GAP&&A.y+A.h+GAP>B.y){
          B.y=snp(A.y+A.h+GAP);moved=true;
        }
      }
    }
    if(!moved)break;
  }

  // ── update DOM ──
  // stepper cells
  phs.forEach(p=>{
    const phEl=document.querySelector(`.ph[data-pid="${p.id}"]`);
    if(phEl){const w=getPW(p.id)*VP.z;phEl.style.width=w+"px";phEl.style.minWidth=w+"px";phEl.style.flexBasis=w+"px";}
  });
  // canvas lanes
  phs.forEach(p=>{
    const le=document.querySelector(`.lane[data-pid="${p.id}"]`);
    if(le){le.style.left=Gnew[p.id].x+"px";le.style.width=getPW(p.id)+"px";}
  });
  // canvas and svg width
  const cv=document.getElementById("cv"),svg=document.getElementById("esvg");
  const tot=Gnew.__tot+120;
  if(cv)cv.style.width=tot+"px";
  if(svg){svg.style.width=tot+"px";svg.setAttribute("width",tot);}
  // blocks
  paintBlks();
}

/* 오늘 날짜의 캔버스 x 좌표 */
function todayX(ip){
  const G=laneG(ip),ps=phsFor(ip),t=new Date();
  if(!ps.length)return null;
  const first=new Date(ps[0].start),last=new Date(ps[ps.length-1].end);
  if(t<first)return 0;
  if(t>last)return G.__tot;
  for(const p of ps){
    const st=new Date(p.start),en=new Date(p.end);
    if(t>=st&&t<=en){
      const g=G[p.id],r=(t-st)/Math.max(1,(en-st));
      return Math.round(g.x+g.w*r);
    }
  }
  return null;
}

/* ── AUTO FIT ── 지그재그 토폴로지 배치 ──
   A→B→C 연결 시: B는 A 우하단, C는 B 우하단 (지그재그)
   AutoFit 내에서만 겹침 방지 (일반 드래그는 자유) */
function autoFit(){
  const ip=S.ipId;if(!ip)return;
  const ps=phsFor(ip);
  const allIds=ITEMS.filter(d=>d.ip===ip).map(d=>d.id);
  const visSet=new Set(allIds);

  /* 위상 정렬으로 flow 순서 결정 */
  const inDeg={},adj={};
  allIds.forEach(id=>{inDeg[id]=0;adj[id]=[];});
  EDGES.filter(e=>visSet.has(e.from)&&visSet.has(e.to)).forEach(e=>{
    if(!adj[e.from].includes(e.to))adj[e.from].push(e.to);
    inDeg[e.to]=(inDeg[e.to]||0)+1;
  });
  const queue=allIds.filter(id=>(inDeg[id]||0)===0);
  const order=[],vis=new Set();
  while(queue.length){
    const id=queue.shift();if(vis.has(id))continue;
    vis.add(id);order.push(id);
    adj[id].forEach(n=>{inDeg[n]--;if(inDeg[n]<=0&&!vis.has(n))queue.push(n);});
  }
  allIds.forEach(id=>{if(!vis.has(id))order.push(id);});

  /* 각 노드에 flow-depth 부여 */
  const depth={};
  order.forEach(id=>{
    let d=0;
    allIds.forEach(src=>{if(adj[src]&&adj[src].includes(id))d=Math.max(d,(depth[src]??-1)+1);});
    depth[id]=d;
  });

  /* Phase별 지그재그 배치 */
  const ZDXR=Math.round(NW*0.55);  // 홀수 depth: x 오른쪽 오프셋
  const ZDY =Math.round(NH*0.70);  // depth마다 y 증가량

  /* Phase 폭 먼저 결정 */
  ps.forEach(p=>{
    const pbs=allIds.filter(id=>{const d=itm(id);return d&&d.phase===p.id;});
    const days=Math.max(1,Math.round((new Date(p.end)-new Date(p.start))/864e5));
    const cols=days>=56?3:days>=28?2:1;
    phasePW[p.id]=Math.max(DEFAULT_PW, LANE_PAD*2+cols*NW+(cols-1)*GAP+ZDXR);
  });
  const G=laneG(ip);

  const placed={};
  ps.forEach(p=>{
    const g=G[p.id];if(!g)return;
    const pbs=order.filter(id=>{const d=itm(id);return d&&d.ip===ip&&d.phase===p.id;});
    if(!pbs.length)return;
    const minD=Math.min(...pbs.map(id=>depth[id]??0));
    /* depth 그룹 */
    const byD={};
    pbs.forEach(id=>{const d=depth[id]??0;(byD[d]||(byD[d]=[])).push(id);});
    let rowY=TOP_PAD;
    Object.keys(byD).map(Number).sort((a,b)=>a-b).forEach(d=>{
      const row=byD[d];
      const isOdd=(d-minD)%2===1;
      let cx=g.x+LANE_PAD+(isOdd?ZDXR:0);
      let maxH=0;
      row.forEach(id=>{
        const bk=itm(id);if(!bk)return;
        if(cx+bk.w>g.x+g.w-LANE_PAD){cx=g.x+LANE_PAD+(isOdd?ZDXR:0);rowY+=maxH+GAP;maxH=0;}
        placed[id]={x:snp(cx),y:snp(rowY)};
        cx+=bk.w+GAP;maxH=Math.max(maxH,bk.h);
      });
      rowY+=maxH+ZDY;
    });
  });

  /* AutoFit 내 겹침 방지: 같은 Phase 내만 */
  const flatBlks=ITEMS.filter(d=>d.ip===ip);
  for(let it=0;it<8;it++){
    let mv=false;
    for(let i=0;i<flatBlks.length;i++){
      const A=flatBlks[i],pa=placed[A.id]||{x:A.x,y:A.y,w:A.w,h:A.h};
      for(let j=i+1;j<flatBlks.length;j++){
        const B=flatBlks[j],pb=placed[B.id]||{x:B.x,y:B.y,w:B.w,h:B.h};
        if(A.phase!==B.phase)continue;
        if(pa.x<pb.x+pb.w+GAP&&pa.x+pa.w+GAP>pb.x&&pa.y<pb.y+pb.h+GAP&&pa.y+pa.h+GAP>pb.y){
          placed[B.id]={x:pb.x,y:snp(pa.y+pa.h+GAP),w:pb.w,h:pb.h};mv=true;
        }
      }
    }
    if(!mv)break;
  }

  /* 좌표 적용 */
  flatBlks.forEach(d=>{if(placed[d.id]){d.x=placed[d.id].x;d.y=placed[d.id].y;}});
  render();
}

/* 공통 Phase가 선점한 날짜 범위 목록 */
function comRanges(){return COM_PH.map(p=>({s:p.start,e:p.end,key:p.key}));}
/* 다른 모든 Phase(공통+IP추가)가 선점한 범위에서 pid 자신은 제외 */
function occupiedRanges(pid){
  const all=[...COM_PH,...EX_PH.filter(p=>p.ip===S.ipId)];
  return all.filter(p=>p.id!==pid).map(p=>({s:p.start,e:p.end}));
}

/* 클릭한 블록 기준 — prev 방향은 prev만, next 방향은 next만 계속 타고감 (양방향 섞지 않음) */
function connectedSet(id){
  const seen=new Set([id]);
  // prev 방향: id로 들어오는 edge만 계속 추적
  let q=[id];
  while(q.length){const c=q.shift();
    EDGES.forEach(e=>{ if(e.to===c&&!seen.has(e.from)){seen.add(e.from);q.push(e.from);} });
  }
  // next 방향: id에서 나가는 edge만 계속 추적
  q=[id];
  while(q.length){const c=q.shift();
    EDGES.forEach(e=>{ if(e.from===c&&!seen.has(e.to)){seen.add(e.to);q.push(e.to);} });
  }
  return seen;
}

/* ── EDGES ── */
function orth(a,b){
  const x1=a.x+a.w,y1=Math.round(a.y+a.h/2),x2=b.x,y2=Math.round(b.y+b.h/2);
  if(x2>=x1+24){const mx=Math.round((x1+x2)/2);
    return y1===y2?`M${x1},${y1}H${x2}`:`M${x1},${y1}H${mx}V${y2}H${x2}`;}
  const out=x1+22,inn=x2-22,low=Math.max(a.y+a.h,b.y+b.h)+26;
  return `M${x1},${y1}H${out}V${low}H${inn}V${y2}H${x2}`;
}
function drawEdges(){
  const svg=$("#esvg");if(!svg)return;
  const vis=visItems().map(d=>d.id);
  let h=`<defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#8b99ab"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#ac6f08"/></marker>
    <marker id="ahl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#0c9a83"/></marker>
    <marker id="ah-s" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0L0,4L8,8Z" fill="#8b99ab"/></marker>
    <marker id="ahl-s" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0L0,4L8,8Z" fill="#0c9a83"/></marker></defs>`;
  const seen=new Set();
  EDGES.filter(e=>vis.includes(e.from)&&vis.includes(e.to)).forEach(e=>{
    const a=itm(e.from),b=itm(e.to);if(!a||!b)return;
    const bi=EDGES.some(x=>x.from===e.to&&x.to===e.from);   // 양방향?
    const key=bi?[e.from,e.to].sort().join("|"):e.id;
    if(bi){if(seen.has(key))return;seen.add(key);}
    const blocked=!bi&&!latR(a)&&stOf(b).lb!=="미제출";
    const on=S.hlSet&&S.hlSet.has(e.from)&&S.hlSet.has(e.to);
    const col=on?"#0c9a83":(blocked?"#ac6f08":"#8b99ab");
    const mk=on?"ahl":(blocked?"ahb":"ah");
    const dpath=orth(a,b);
    h+=`<path d="${dpath}" stroke="${col}" stroke-width="${on?2.1:1.6}" fill="none"
      marker-end="url(#${mk})" ${bi?`marker-start="url(#${on?"ahl-s":"ah-s"})"`:""}
      ${blocked?'stroke-dasharray="5 4"':""} shape-rendering="crispEdges"/>`;
    if(on){   // 1) 점선 흐름 애니메이션 — 실선 대신 점선이 이동
      // 배경: 원래 선 숨김
      h+=`<path d="${dpath}" stroke="${col}" stroke-width="1.6" fill="none"
        opacity="0.18" shape-rendering="crispEdges"/>`;
      // 점선 레이어
      h+=`<path d="${dpath}" stroke="#0c9a83" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-dasharray="8 10"
        style="animation:flowdash .65s linear infinite"
        marker-end="url(#ahl)"/>`;
    }
    if(bi){   // 순환(refresh) 아이콘
      const mx=Math.round((a.x+a.w+b.x)/2), my=Math.round((a.y+a.h/2+b.y+b.h/2)/2);
      if(!S.edit){   // 2) 편집 모드에서는 순환 아이콘 숨김
        // flow 선의 실제 중점 계산 (orth 경로의 midpoint)
        const ax=a.x+a.w, ay=Math.round(a.y+a.h/2), bx=b.x, by=Math.round(b.y+b.h/2);
        let cx2,cy2;
        if(bx>=ax+24){cx2=Math.round((ax+bx)/2);cy2=Math.round((ay+by)/2);}
        else{cx2=ax+22;cy2=Math.max(a.y+a.h,b.y+b.h)+26;}
        h+=`<g transform="translate(${cx2-11},${cy2-11})" pointer-events="none">
          <path d="M16.8 9.8A5.4 5.4 0 0 0 6.8 8.9" stroke="#bc4f1a" stroke-width="1.9"
            fill="none" stroke-linecap="round"/>
          <path d="M5.2 13.2a5.4 5.4 0 0 0 9.8 1.1" stroke="#bc4f1a" stroke-width="1.9"
            fill="none" stroke-linecap="round"/>
          <path d="M17 6v3.8h-3.8" stroke="#bc4f1a" stroke-width="1.9" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 16v-3.8h3.8" stroke="#bc4f1a" stroke-width="1.9" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
        </g>`;
      }
    }
    if(S.edit&&canEd())h+=`<path class="eh" data-eid="${e.id}" d="${dpath}" stroke="transparent"
      stroke-width="12" fill="none"><title>클릭하면 연결 삭제</title></path>`;});
  if(S.link&&itm(S.link)&&S.linkPos){const a=itm(S.link);
    h+=`<path d="M${a.x+a.w},${Math.round(a.y+a.h/2)}H${S.linkPos.x}V${S.linkPos.y}"
      stroke="#0c9a83" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ahl)"/>`;}
  svg.innerHTML=h;
  svg.querySelectorAll(".eh").forEach(p=>p.onclick=ev=>{ev.stopPropagation();
    EDGES=EDGES.filter(x=>x.id!==p.dataset.eid);drawEdges();toast("연결을 지웠습니다");});
}

/* ── BIND ALL INTERACTIONS ── */
function bindAll(W,H,G){
  const vp=$("#vp"),cv=$("#cv");if(!vp||!cv)return;
  const cvPt=e=>{const r=cv.getBoundingClientRect();
    return{x:(e.clientX-r.left)/VP.z, y:e.clientY-r.top};};

  /* ZOOM */
  vp.addEventListener("wheel",e=>{
    if(S.edit)return;                              // 12) 편집 중 줌 금지
    if(e.shiftKey)return;                          // shift+휠 → 세로 스크롤
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return; // 3) 횡 휠 무시
    e.preventDefault();
    const r=vp.getBoundingClientRect(),mx=e.clientX-r.left;
    const dz=e.deltaY<0?ZOOM_STEP:-ZOOM_STEP;
    const nz=Math.min(ZOOM_MAX,Math.max(minZoom(),VP.z+dz)); // 2) 최소=화면 채움
    VP.x=mx-(mx-VP.x)*(nz/VP.z);
    VP.z=nz;clampVP();applyVP();
  },{passive:false});

  /* PHASE RESIZE — stepper handle */
  document.querySelectorAll(".ph-resize").forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.stopPropagation();e.preventDefault();
      const pid=h.dataset.phrid;
      S.phResize={pid,startX:e.clientX,startW:getPW(pid)};
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener("pointermove",e=>{
      if(!S.phResize||S.phResize.pid!==h.dataset.phrid)return;
      const dx=(e.clientX-S.phResize.startX)/VP.z;
      resizePhase(S.phResize.pid, S.phResize.startW+dx);
    });
    h.addEventListener("pointerup",()=>{if(S.phResize){S.phResize=null;render();}});
  });

  /* PHASE RESIZE — canvas lane handle */
  document.querySelectorAll(".lane-resize").forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.stopPropagation();e.preventDefault();
      const pid=h.dataset.lrid;
      S.phResize={pid,startX:e.clientX,startW:getPW(pid)};
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener("pointermove",e=>{
      if(!S.phResize||S.phResize.pid!==h.dataset.lrid)return;
      const dx=(e.clientX-S.phResize.startX)/VP.z;
      resizePhase(S.phResize.pid, S.phResize.startW+dx);
    });
    h.addEventListener("pointerup",()=>{if(S.phResize){S.phResize=null;render();}});
  });

  /* pin */
  cv.querySelectorAll("[data-pin]").forEach(p=>{
    p.addEventListener("pointerdown",e=>e.stopPropagation());
    p.addEventListener("click",e=>{e.stopPropagation();
      S.link=S.link===p.dataset.pin?null:p.dataset.pin;S.linkPos=null;render();});});

  /* grip */
  cv.querySelectorAll("[data-grip]").forEach(g=>{
    g.addEventListener("pointerdown",e=>{e.stopPropagation();e.preventDefault();
      const b=blk(g.dataset.grip),p=cvPt(e);
      S.drag={mode:"resize",b,el:g.closest("[data-bid]"),ox:p.x-b.w,oy:p.y-b.h};
      S.drag.el.classList.add("rs");g.setPointerCapture(e.pointerId);});
    g.addEventListener("pointermove",e=>{
      if(!S.drag||S.drag.mode!=="resize"||S.drag.el!==g.closest("[data-bid]"))return;
      const p=cvPt(e),D=S.drag;
      const nw=snp(Math.max(MINW,Math.min(MAXW,p.x-D.ox)));
      const nh=snp(Math.max(MINH,Math.min(MAXH,p.y-D.oy)));
      if(nw===D.b.w&&nh===D.b.h)return;
      D.b.w=nw;D.b.h=nh;
      D.el.style.width=nw+"px";D.el.style.height=nh+"px";
      drawEdges();});
    g.addEventListener("pointerup",()=>{if(S.drag?.mode==="resize"){S.drag.el.classList.remove("rs","bump");S.drag=null;render();}});});

  /* block pointerdown for dragging */
  cv.querySelectorAll("[data-bid]").forEach(el=>{
    const b=blk(el.dataset.bid);
    el.addEventListener("pointerdown",e=>{
      if(!S.edit||!canEd())return;
      if(e.target.dataset.pin!==undefined||e.target.dataset.grip!==undefined)return;
      e.preventDefault();e.stopPropagation();
      const p=cvPt(e);
      S.drag={mode:"move",b,el,dx:p.x-b.x,dy:p.y-b.y,px:p.x,py:p.y,moved:false,accX:0};
      el.classList.add("dg");el.setPointerCapture(e.pointerId);});
    el.addEventListener("pointermove",e=>{
      if(!S.drag||S.drag.el!==el||S.drag.mode!=="move")return;
      const p=cvPt(e),D=S.drag;
      const rawX=Math.max(PAD,Math.min(W-D.b.w-PAD,p.x-D.dx));
      const rawY=Math.max(PAD,Math.min(H-D.b.h-PAD,p.y-D.dy));
      D.accX+=rawX-D.b.x;
      const nx=snp(wallAdj(D.b.x,D.b.w,rawX,D.accX));
      if(nx!==snp(rawX))D.accX=0;
      const ny=snp(rawY);
      D.px=p.x;D.py=p.y;D.moved=true;
      D.b.x=nx;D.b.y=ny;
      D.el.style.left=nx+"px";D.el.style.top=ny+"px";
      drawEdges();});
    el.addEventListener("pointerup",e=>{
      if(!S.drag||S.drag.el!==el)return;
      const D=S.drag;el.classList.remove("dg","bump");
      const moved=D.moved;S.drag=null;
      if(moved){
        // 놓인 위치의 Phase 레인으로 소속 변경
        const cx=D.b.x+D.b.w/2;
        const np=phaseAtX(S.ipId,cx);
        if(np&&np!==D.b.phase){
          const oldP=D.b.phase;
          D.b.phase=np;
          // 새 레인이 좁아 넘치면 개행 정리
          if(laneOverflow(S.ipId,np))reflowLane(S.ipId,np);
          render();
          const pk=(phOf(S.ipId,np)||{key:""}).key;
          toast(`${pk} 구간으로 옮겼습니다`);
        }
        return;
      }
      // click while in edit mode
      if(S.link&&S.link!==b.id&&itm(b.id)&&itm(S.link)){
        if(!EDGES.some(x=>x.from===S.link&&x.to===b.id))EDGES.push({id:"g"+Date.now(),from:S.link,to:b.id});
        S.link=null;render();toast("연결했습니다");return;}
      if(nOf(b.id)){S.noteDlg=b.id;renderModal();return;}
      S.sel=S.sel===b.id?null:b.id;render();});
    // VIEW MODE: 클릭 = 선택 + 연결 flow 하이라이트 (dialog는 상세 버튼으로)
    el.addEventListener("click",e=>{
      e.stopPropagation();
      if(S.edit)return;
      if(S.drag&&S.drag.moved)return;
      if(S.sel===b.id){S.sel=null;S.hlSet=null;}
      else{S.sel=b.id;S.hlSet=connectedSet(b.id);}
      render();
    });});

  /* link cursor line */
  cv.querySelectorAll("[data-open]").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>e.stopPropagation());
    btn.addEventListener("click",e=>{e.stopPropagation();
      const id=btn.dataset.open;
      if(itm(id)){S.openId=id;S.tab="overview";renderModal();}
      else if(nOf(id)){S.noteDlg=id;renderModal();}});});
  cv.addEventListener("mousemove",e=>{if(S.link){S.linkPos=cvPt(e);drawEdges();}});
  // 1) 뷰포트 레벨 클릭 → 해제 (블록은 stopPropagation으로 막음)
  vp.addEventListener("click",e=>{
    // 블록이나 버튼 위 클릭은 무시
    if(e.target.closest("[data-bid]")||e.target.closest("[data-open]")||e.target.closest(".tb-btn"))return;
    if(S.link){S.link=null;render();}
    else if(S.sel||S.hlSet){S.sel=null;S.hlSet=null;render();}
  });

  /* ── PAN ── left-drag on empty canvas / middle-button anywhere */
  let panPid=null;
  vp.addEventListener("pointerdown",e=>{
    // block drag takes priority — only start pan if nothing was captured
    if(S.drag)return;
    if(S.phResize)return;
    // middle button always pans
    const isMiddle=e.button===1;
    // left button: only if click target is vp, cv, lane, or esvg (not a block)
    const isEmptyLeft=e.button===0&&(
      e.target===vp||e.target===cv||
      e.target.classList.contains("lane")||
      e.target.classList.contains("lane-k")||
      e.target.classList.contains("lane-l")||
      e.target===document.getElementById("esvg"));
    if(!isMiddle&&!isEmptyLeft)return;
    e.preventDefault();
    S.pan={startX:e.clientX-VP.x};
    vp.setPointerCapture(e.pointerId);panPid=e.pointerId;
    vp.style.cursor="grabbing";
  });
  vp.addEventListener("pointermove",e=>{
    if(!S.pan||panPid!==e.pointerId)return;
    VP.x=e.clientX-S.pan.startX;         // 좌우 이동만
    clampVP();applyVP();
  });
  vp.addEventListener("pointerup",e=>{
    if(panPid!==e.pointerId)return;
    S.pan=null;panPid=null;vp.style.cursor="";
  });
  vp.addEventListener("pointercancel",()=>{S.pan=null;panPid=null;vp.style.cursor="";});
}

function bindModal(d,own){
  const closeDeliv=()=>{S.openId=null;
    if(S.hldBack){S.hldBack=false;S.hldDlg=true;}
    renderModal();};
  $("#clM").addEventListener("click",closeDeliv);
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;renderModal();}));
  // Release 일정 토글
  const picked=new Set(seriesOf(d.ip,seriesKey(d)).map(x=>x.phase));
  document.querySelectorAll("[data-phpick]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.phpick;
    if(picked.has(id)){ if(picked.size<=1)return; picked.delete(id);b.classList.remove("on"); }
    else{ picked.add(id);b.classList.add("on"); }
  }));
  const si=$("#svInfo");if(si)si.addEventListener("click",()=>{
    const nm=$("#dNm").value.trim();if(!nm){$("#dNm").classList.add("err");return;}
    const net=$("#dNt").value, ty=net==="HPC"?"path":$("#dTy").value;
    const sid=seriesKey(d);
    seriesOf(d.ip,sid).forEach(x=>{x.name=nm;x.net=net;x.type=ty;});
    const before=seriesOf(d.ip,sid).map(x=>x.phase).sort().join(",");
    setSchedule(d,[...picked]);
    const after=seriesOf(d.ip,sid).map(x=>x.phase).sort().join(",");
    S.openId=null;const back=S.hldBack;S.hldBack=false;
    render();if(back){S.hldDlg=true;renderModal();}
    toast(before!==after?`Release 일정 ${picked.size}개 구간`:"저장했습니다");});
  // flow link add / remove
  const la=$("#lkAdd");if(la)la.addEventListener("click",()=>{
    const t=$("#lkTgt").value;if(!t)return;
    if(!EDGES.some(e=>e.from===d.id&&e.to===t))EDGES.push({id:"g"+Date.now(),from:d.id,to:t});
    renderModal();drawEdges();toast("연결했습니다");});
  document.querySelectorAll("[data-unlink]").forEach(b=>b.addEventListener("click",()=>{
    EDGES=EDGES.filter(e=>e.id!==b.dataset.unlink);
    renderModal();drawEdges();toast("연결을 해제했습니다");}));
  const ns=$("#fNt"),ts=$("#fTy"),fi=$("#fFl"),lb=$("#fLb");
  const sn=()=>{if(!ns)return;
    if(ns.value==="HPC"){ts.value="path";ts.disabled=true;lb.textContent="HPC vwp 경로";fi.placeholder="/vwp/cis_a7/<ip>/...";}
    else{ts.disabled=false;if(ts.value==="path")ts.value="word";lb.textContent="파일명";fi.placeholder="spec_draft.docx";}};
  if(ns){ns.addEventListener("change",sn);sn();}
  const up=$("#upBtn");if(up)up.addEventListener("click",()=>{
    const file=fi.value.trim(),er=$("#fEr"),net=ns.value,type=net==="HPC"?"path":ts.value;
    er.style.display="none";fi.classList.remove("err");
    if(!file){fi.classList.add("err");er.textContent="파일명 또는 경로를 입력하세요.";er.style.display="block";return;}
    if(net==="HPC"&&!file.startsWith("/vwp/")){fi.classList.add("err");
      er.textContent="HPC 경로는 /vwp/ 로 시작해야 합니다.";er.style.display="block";return;}
    const last=latA(d);
    d.versions.unshift(MV(last?last.major:0,last?last.minor+1:1,"minor",S.me,stamp(),
      $("#fNo").value.trim()||"작업본 갱신",file));
    d.net=net;d.type=type;render();toast("작업본을 올렸습니다");});
  const rl=$("#rlBtn");if(rl)rl.addEventListener("click",()=>{const last=latA(d);
    d.versions.unshift(MV((latR(d)?latR(d).major:0)+1,0,"major",S.me,stamp(),"Release",last?last.file:d.file));
    render();toast("Release 했습니다");});
  // 전달 부서/담당자 저장
  const rDept=$("#rDept");
  if(rDept)rDept.addEventListener("change",()=>{
    // 부서가 바뀌면 개별 담당자 옵션 갱신을 위해 다시 렌더
    d.recvDept=rDept.value||null;d.recvContact=null;renderModal();});
  const svR=$("#svRecv");if(svR)svR.addEventListener("click",()=>{
    d.recvDept=$("#rDept").value||null;
    d.recvContact=$("#rContact").value||null;
    render();toast("전달 정보를 저장했습니다");});
}


/* ── BOOT ── */
seedXY();
$("#projSel").addEventListener("change",e=>{S.proj=e.target.value;render();});
$("#ipSel").addEventListener("change",e=>{S.ipId=e.target.value;S.hlSet=null;S.sel=null;S.recv=false;S.edit=false;VP.x=0;VP.y=0;render();requestAnimationFrame(()=>{VP.z=Math.max(VP.z,minZoom());clampVP();applyVP();});});
$("#userSel").addEventListener("change",e=>{S.me=e.target.value;S.recv=false;S.edit=false;S.openId=null;render();});
$("#recvTog").addEventListener("click",()=>{S.recv=!S.recv;S.edit=false;render();});
render();
requestAnimationFrame(()=>{if(S.ipId){VP.z=Math.max(VP.z,minZoom());clampVP();applyVP();}});
window.addEventListener('resize',()=>{if(S.ipId){VP.z=Math.max(VP.z,minZoom());clampVP();applyVP();}});
</script>
</body>
</html>
